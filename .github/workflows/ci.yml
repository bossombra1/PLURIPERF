name: PLURIPERF CI

on:
  push:
    branches: [main, migration/postgresql-monorepo]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pluriperf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pluriperf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pluriperf
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Initialize PostgreSQL schema
        run: npm run db:init --workspace=backend
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
